<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExitLab — Evacuation Simulator</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        min-height: 100vh;
        background: #0f172a;
        color: #e2e8f0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      .exitlab-app-container {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        width: 100%;
        box-sizing: border-box;
        background: #0f172a;
        color: #e2e8f0;
        padding: 1rem 1.5rem;
      }

      .exitlab-main-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(340px, 28vw, 420px);
        gap: 1rem;
        flex: 1;
        width: 100%;
      }

      @media (max-width: 960px) {
        .exitlab-app-container {
          padding: 0.75rem 1rem;
        }
        .exitlab-main-layout {
          grid-template-columns: 1fr;
        }
      }

      @media print {
        body { background: #fff !important; color: #000 !important; }
        body * { visibility: hidden; }
        #exitlab-print-report, #exitlab-print-report * { visibility: visible; }
        #exitlab-print-report {
          position: absolute;
          left: 0;
          top: 0;
          width: 100% !important;
          max-width: 100% !important;
          background: #fff !important;
          color: #000 !important;
          border: none !important;
          box-shadow: none !important;
          padding: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
